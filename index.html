<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lozinka Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --surface: #18181b;
      --border: #2d2d35;
      --accent: #9147ff;
      --accent-dim: #772ce8;
      --text: #efeff1;
      --muted: #adadb8;
      --green: #00c853;
      --yellow: #ffd600;
      --red: #ff3d3d;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 440px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .password-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 0.75rem;
    }

    #password-display {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      color: var(--text);
      word-break: break-all;
      flex: 1;
      letter-spacing: 1px;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 10px;
      font-size: 0.8rem;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      margin-bottom: 0.4rem;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }

    .strength-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.1rem;
    }

    .option label {
      font-size: 0.9rem;
      color: var(--text);
    }

    .option .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 140px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .slider-val {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      min-width: 24px;
      text-align: right;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track { background: var(--accent); }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(18px);
    }

    .gen-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .gen-btn:hover { background: var(--accent-dim); }
    .gen-btn:active { transform: scale(0.98); }

    footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
      opacity: 0.5;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Lozinka Generator</h1>
  <p class="subtitle">Generiraj sigurnu lozinku u sekundi</p>

  <div class="password-box">
    <span id="password-display">Klikni generiraj...</span>
    <button class="copy-btn" onclick="copyPassword()">Kopiraj</button>
  </div>

  <div class="strength-bar">
    <div class="strength-fill" id="strength-fill"></div>
  </div>
  <p class="strength-label" id="strength-label">—</p>

  <hr />

  <div class="option">
    <div>
      <div>Duljina</div>
    </div>
    <div class="slider-wrap">
      <input type="range" id="length" min="6" max="32" value="16" step="1" oninput="onLengthChange()" />
      <span class="slider-val" id="length-val">16</span>
    </div>
  </div>

  <div class="option">
    <div>
      <div>Velika slova</div>
      <div class="hint">A B C D...</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="uppercase" checked onchange="generate()" />
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="option">
    <div>
      <div>Brojevi</div>
      <div class="hint">1 2 3 4...</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="numbers" checked onchange="generate()" />
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="option">
    <div>
      <div>Simboli</div>
      <div class="hint">! @ # $ % ...</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="symbols" onchange="generate()" />
      <span class="toggle-track"></span>
    </label>
  </div>

  <button class="gen-btn" onclick="generate()">Generiraj novu lozinku</button>
</div>

<footer>napravljeno za GitHub Pages</footer>

<script>
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const nums  = '0123456789';
  const syms  = '!@#$%^&*()-_=+[]{}|;:,.<>?';

  function generate() {
    const len = parseInt(document.getElementById('length').value);
    const useUpper   = document.getElementById('uppercase').checked;
    const useNumbers = document.getElementById('numbers').checked;
    const useSymbols = document.getElementById('symbols').checked;

    let charset = lower;
    if (useUpper)   charset += upper;
    if (useNumbers) charset += nums;
    if (useSymbols) charset += syms;

    let password = '';
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    for (let i = 0; i < len; i++) {
      password += charset[arr[i] % charset.length];
    }

    document.getElementById('password-display').textContent = password;
    updateStrength(password, useUpper, useNumbers, useSymbols);
  }

  function onLengthChange() {
    document.getElementById('length-val').textContent = document.getElementById('length').value;
    generate();
  }

  function updateStrength(pwd, upper, nums, syms) {
    let score = 0;
    if (pwd.length >= 8)  score++;
    if (pwd.length >= 14) score++;
    if (pwd.length >= 20) score++;
    if (upper) score++;
    if (nums)  score++;
    if (syms)  score++;

    const fill = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');

    if (score <= 2) {
      fill.style.width = '25%';
      fill.style.background = '#ff3d3d';
      label.textContent = 'Slaba lozinka';
      label.style.color = '#ff3d3d';
    } else if (score <= 4) {
      fill.style.width = '60%';
      fill.style.background = '#ffd600';
      label.textContent = 'Srednja lozinka';
      label.style.color = '#ffd600';
    } else {
      fill.style.width = '100%';
      fill.style.background = '#00c853';
      label.textContent = 'Jaka lozinka';
      label.style.color = '#00c853';
    }
  }

  function copyPassword() {
    const pwd = document.getElementById('password-display').textContent;
    if (!pwd || pwd === 'Klikni generiraj...') return;
    navigator.clipboard.writeText(pwd).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Kopirano!';
      setTimeout(() => btn.textContent = 'Kopiraj', 1500);
    });
  }

  generate();
</script>
</body>
</html>
